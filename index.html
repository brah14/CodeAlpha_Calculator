<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button class="key function" data-action="clear" aria-label="All clear">AC</button>
      <button class="key function" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key function" data-action="percent" aria-label="Percent">%</button>
      <button class="key operator" data-operator="/" aria-label="Divide">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key operator" data-operator="*" aria-label="Multiply">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key operator" data-operator="-" aria-label="Subtract">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key operator" data-operator="+" aria-label="Add">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </div>
    <p class="keyboard-hint">Keyboard supported · Esc clears · Enter calculates</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
